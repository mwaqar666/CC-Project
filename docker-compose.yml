services:
  server:
    build:
      context: ./server
    environment:
      - RAY_DASHBOARD_HOST=0.0.0.0
      - RAY_METRICS_EXPORT_PORT=8080
    ports:
      - "8000:8000"
      - "8265:8265"
      - "8080:8080"
    volumes:
      - ./server:/app
    shm_size: "2gb"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./server/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - server

  client:
    build:
      context: ./client
    depends_on:
      - server
    environment:
      - IMAGE_DIR=/app/images
      - SERVER_HOST=server
      - SERVER_PORT=8000
    volumes:
      - ./client:/app

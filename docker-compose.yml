services:
  server:
    build:
      context: ./server
    ports:
      - "8001:8001"
    volumes:
      - ./server:/app
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: /app

  client:
    build:
      context: ./client
    depends_on:
      - server
    environment:
      - IMAGE_DIR=/app/images
      - MODEL_SERVER_HOST=server
      - MODEL_SERVER_PORT=8001
    ports:
      - "5001:5001"
    volumes:
      - ./images:/app/images
      - ./client:/app
    develop:
      watch:
        - action: sync+restart
          path: ./client
          target: /app

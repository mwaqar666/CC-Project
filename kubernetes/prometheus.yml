global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Job 1: Your custom python application metrics
  - job_name: "ml-cluster-metrics"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - ml-apps
    relabel_configs:
      # If the pod is a worker, force Prometheus to scrape port 8000
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: worker
        target_label: __address__
        replacement: $1:8000
      # If the pod is the dispatcher, force Prometheus to scrape port 8000
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: dispatcher
        target_label: __address__
        replacement: $1:8000

  # Job 2: Core machine container stats directly from the node engine
  - job_name: "kubernetes-cadvisor"
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Job 1: Your custom python application metrics
  - job_name: "ml-cluster-metrics"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - ml-apps
    relabel_configs:
      # 1. Map target port 8000 for metrics scraping
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_ip]
        regex: "(worker|dispatcher|autoscaler|client);(.*)"
        target_label: __address__
        replacement: "${2}:8000"

      # 2. Add namespace label
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
        action: replace

      # 3. Add pod label
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
        action: replace

      # 4. Add app label
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
        action: replace

  # Job 2: Core machine container stats directly from the node engine
  - job_name: "kubernetes-cadvisor"
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

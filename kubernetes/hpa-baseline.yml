apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-server-autoscaler
  namespace: default
spec:
  # This targets your server deployment explicitly
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: server
  minReplicas: 1
  maxReplicas: 3 # Safe limit for your 8-core Mac
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # To switch to Experiment 2, simply change this to 90

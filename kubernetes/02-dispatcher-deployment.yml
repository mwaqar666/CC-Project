apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: ml-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      containers:
        - name: dispatcher
          image: dispatcher-image:latest
          imagePullPolicy: Never
          command: ["uvicorn", "dispatcher:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-service
  namespace: ml-apps
spec:
  selector:
    app: dispatcher
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. Automatically generate the ConfigMap from your raw standalone file
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
    options:
      labels:
        app: prometheus

# 2. List the rest of your ordered files to track and spin up
resources:
  - 00-namespaces.yml
  - 01-prometheus-deployment.yml
  - 02-grafana-deployment.yml
  - 03-dispatcher-deployment.yml
  - 04-worker-deployment.yml
  - 05-client-deployment.yml
  - 06-hpa-baseline.yml
  - 07-autoscaler-deployment.yml

# 3. Dynamic Relative Path Overrides ◄ ADDED
patches:
  - target:
      kind: Deployment
      name: prometheus
      namespace: monitoring
    patch: |
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: ../storage/prometheus

  - target:
      kind: Deployment
      name: grafana
      namespace: monitoring
    patch: |
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: ../storage/grafana

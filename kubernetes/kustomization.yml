apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. Automatically generate the ConfigMap from your raw standalone file
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
    options:
      labels:
        app: prometheus

# 2. List the rest of your ordered files to track and spin up
resources:
  - 00-namespaces.yml
  - 01-prometheus-deployment.yml
  - 02-dispatcher-deployment.yml
  - 03-worker-deployment.yml
  - 04-client-deployment.yml
  - 05-hpa-baseline.yml
  - 06-autoscaler-deployment.yml

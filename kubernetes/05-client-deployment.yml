apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: ml-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: client-image:latest
          imagePullPolicy: Never
          command: ["uvicorn", "client:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: client-http
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          env:
            - name: SERVER_URL
              value: "http://dispatcher-service.ml-apps.svc.cluster.local:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: ml-apps
spec:
  type: NodePort
  selector:
    app: client
  ports:
    - name: client-http
      protocol: TCP
      port: 8000
      targetPort: 8000

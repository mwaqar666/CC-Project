apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-server
  labels:
    app: ray-server
spec:
  replicas: 1 # This value will be manipulated by your autoscaler script later
  selector:
    matchLabels:
      app: ray-server
  template:
    metadata:
      labels:
        app: ray-server
    spec:
      containers:
        - name: server
          image: ray-server-image:latest
          imagePullPolicy: Never # Forces K8s to use your locally built image
          ports:
            - containerPort: 8000 # Ingress Traffic
            - containerPort: 8265 # Dashboard Access
            - containerPort: 8080 # Prometheus Metrics
          resources:
            limits:
              cpu: "1" # Mandated project limit
              memory: "2Gi"
            requests:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi # Replaces shm_size: "2gb"
---
apiVersion: v1
kind: Service
metadata:
  name: server # Acts as a fixed network domain link
spec:
  selector:
    app: ray-server
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: dashboard
      protocol: TCP
      port: 8265
      targetPort: 8265
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: 8080
